<!DOCTYPE html>
<html lang="fa" dir="auto">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MirzaKateb · Shared Session</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #FAF8F4; --paper-raised: #FFFDF9; --ink: #2C2C2C;
      --ink-soft: #5b5750; --ink-faint: #8f897e;
      --olive: #556052; --gold: #B89C5A;
      --line: #e7e1d6; --line-strong: #d8d1c2;
      --bg: var(--paper); --surface: var(--paper-raised);
      --text: var(--ink); --text-soft: var(--ink-soft); --text-faint: var(--ink-faint);
      --border: var(--line);
      --radius: 14px; --radius-s: 8px;
      --shadow: 0 1px 2px rgba(44,44,44,.04),0 2px 8px rgba(44,44,44,.05);
      --display: "Vazirmatn",ui-sans-serif,system-ui,sans-serif;
      --body: "Vazirmatn",ui-sans-serif,system-ui,sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #22211d; --paper-raised: #2a2925; --ink: #ece7dc;
        --ink-soft: #c3bdaf; --ink-faint: #8d887c;
        --olive: #8ea083; --gold: #cdb679;
        --line: #38362f; --line-strong: #45433a;
        --shadow: 0 1px 2px rgba(0,0,0,.25),0 2px 8px rgba(0,0,0,.28);
      }
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
    h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.2;margin:0;letter-spacing:-.015em;}
    h1{font-size:1.9rem;} h2{font-size:1.25rem;} h3{font-size:1.05rem;}
    a{color:var(--olive);text-decoration:none;}
    .wrap{max-width:820px;margin:0 auto;padding:2rem 1rem 5rem;}
    .header{border-bottom:1px solid var(--border);padding-bottom:1.4rem;margin-bottom:2rem;}
    .brand{font-size:.8rem;font-weight:600;color:var(--text-faint);letter-spacing:.08em;text-transform:uppercase;margin-bottom:.6rem;}
    .meta{display:flex;gap:1rem;flex-wrap:wrap;font-size:.82rem;color:var(--text-faint);margin-top:.5rem;}
    .section{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.4rem 1.6rem;margin-bottom:1.4rem;box-shadow:var(--shadow);}
    .eyebrow{font-size:.72rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--olive);margin-bottom:.8rem;}
    .transcript{white-space:pre-wrap;line-height:1.9;font-size:.95rem;}
    .speaker-turn{display:flex;gap:.7rem;align-items:baseline;padding:.3rem 0;border-bottom:1px solid var(--border);line-height:1.7;}
    .speaker-label{font-size:.76rem;font-weight:600;white-space:nowrap;min-width:80px;flex-shrink:0;}
    .speaker-text{flex:1;font-size:.95rem;}
    .ai-table{width:100%;border-collapse:collapse;font-size:.88rem;}
    .ai-table th{text-align:left;font-weight:600;font-size:.76rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text-faint);padding:.5rem .8rem;border-bottom:2px solid var(--border);}
    .ai-table td{padding:.55rem .8rem;border-bottom:1px solid var(--border);}
    .ai-table tr:last-child td{border-bottom:none;}
    .pill{display:inline-block;padding:.15rem .55rem;border-radius:99px;font-size:.72rem;font-weight:600;}
    .pill-high{background:#f0ebe0;color:#7a5c20;}
    .pill-medium{background:#eef0e8;color:var(--olive);}
    .pill-low{background:#e8ede8;color:#3d5c3a;}
    .output-section h1,.output-section h2,.output-section h3{margin:.8rem 0 .3rem;}
    .output-section p{margin:.3rem 0;line-height:1.8;}
    .output-section ul,.output-section ol{padding-left:1.4rem;margin:.3rem 0;}
    .output-section li{margin:.2rem 0;}
    .output-tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .otab{padding:.3rem .8rem;border-radius:99px;border:1px solid var(--border);background:none;cursor:pointer;font-size:.82rem;font-family:var(--body);color:var(--text-soft);}
    .otab.active{background:var(--olive);color:#fff;border-color:var(--olive);}
    .loading{text-align:center;padding:4rem;color:var(--text-faint);}
    .spinner{width:32px;height:32px;border:3px solid var(--border);border-top-color:var(--olive);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 1rem;}
    .error-box{background:#fff8f0;border:1px solid #e0c48a;border-radius:var(--radius);padding:2rem;text-align:center;color:var(--ink-soft);}
    @keyframes spin{to{transform:rotate(360deg)}}
    .copy-btn{float:right;padding:.25rem .7rem;border-radius:var(--radius-s);border:1px solid var(--border);background:none;cursor:pointer;font-size:.78rem;font-family:var(--body);color:var(--text-soft);}
    .copy-btn:hover{background:var(--border);}
    .footer{text-align:center;font-size:.78rem;color:var(--text-faint);margin-top:3rem;padding-top:1.4rem;border-top:1px solid var(--border);}
  </style>
</head>
<body>
<div class="wrap">
  <div id="app"><div class="loading"><div class="spinner"></div>Loading…</div></div>
</div>
<script>
const SPEAKER_COLORS = ["#556052","#B89C5A","#7b6fa0","#5b8c5a","#8c5a5a"];

function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}

function fmtDuration(secs){
  if(!secs) return "";
  const m=Math.floor(secs/60),s=secs%60;
  return m+"m "+(s<10?"0":"")+s+"s";
}

function relDate(ts){
  const d=new Date(ts);
  return d.toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
}

function renderMd(text){
  return text
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/^### (.+)$/gm,"<h3>$1</h3>")
    .replace(/^## (.+)$/gm,"<h2>$1</h2>")
    .replace(/^# (.+)$/gm,"<h1>$1</h1>")
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\*(.+?)\*/g,"<em>$1</em>")
    .replace(/^[-*] (.+)$/gm,"<li>$1</li>")
    .replace(/(<li>.*<\/li>\n?)+/g,(m)=>"<ul>"+m+"</ul>")
    .replace(/^(\d+)\. (.+)$/gm,"<li>$2</li>")
    .replace(/\n\n+/g,"</p><p>")
    .replace(/^(?!<[hulo])(.+)$/gm,(m)=>m.startsWith("<")?m:"<p>"+m+"</p>");
}

function renderDiarized(text){
  const speakerMap={};let colorIdx=0;
  return text.split("\n").map(line=>{
    const m=line.match(/^\[(.+?)\]:\s*(.*)/);
    if(m){
      const sp=m[1];
      if(!speakerMap[sp]) speakerMap[sp]=SPEAKER_COLORS[colorIdx++%SPEAKER_COLORS.length];
      return `<div class="speaker-turn"><span class="speaker-label" style="color:${speakerMap[sp]}">${esc(sp)}</span><span class="speaker-text" dir="auto">${esc(m[2])}</span></div>`;
    }
    return line.trim()?`<p style="margin:.2rem 0">${esc(line)}</p>`:"";
  }).join("");
}

function priorityClass(p){return p==="high"?"pill-high":p==="low"?"pill-low":"pill-medium";}

async function load(){
  const token=location.pathname.split("/").pop();
  let data;
  try{
    const r=await fetch("/api/share/"+token);
    if(!r.ok){const e=await r.json();throw new Error(e.error||"Not found");}
    data=await r.json();
  }catch(e){
    document.getElementById("app").innerHTML=`<div class="error-box"><h3>Link not found</h3><p>${esc(e.message)}</p></div>`;
    return;
  }

  const hasOutputs=data.outputs&&data.outputs.length;
  const hasTx=data.transcript!=null;
  const hasActs=data.actionItems&&data.actionItems.length;

  let activeOut=hasOutputs?data.outputs[0].id:null;

  function render(){
    let html=`
      <div class="header">
        <div class="brand">میرزا کاتب · MirzaKateb</div>
        <h1>${esc(data.title)}</h1>
        <div class="meta">
          <span>🗓 ${relDate(data.date)}</span>
          ${data.duration?`<span>⏱ ${fmtDuration(data.duration)}</span>`:""}
          <span>👤 ${esc(data.ownerName)}</span>
        </div>
      </div>`;

    if(hasOutputs){
      const out=data.outputs.find(o=>o.id===activeOut)||data.outputs[0];
      const ver=out.versions[0];
      html+=`<div class="section">
        <div class="eyebrow">Output</div>
        ${data.outputs.length>1?`<div class="output-tabs">${data.outputs.map(o=>`<button class="otab ${o.id===activeOut?"active":""}" onclick="setOut('${o.id}')">${esc(o.type)}</button>`).join("")}</div>`:""}
        <button class="copy-btn" onclick="copyText(${JSON.stringify(ver.content)})">Copy</button>
        <div class="output-section" dir="auto">${renderMd(ver.content)}</div>
      </div>`;
    }

    if(hasActs){
      html+=`<div class="section">
        <div class="eyebrow">Action Items</div>
        <div style="overflow-x:auto"><table class="ai-table"><thead><tr>
          <th>Task</th><th>Owner</th><th>Deadline</th><th>Priority</th><th>Status</th>
        </tr></thead><tbody>
        ${data.actionItems.map(it=>`<tr>
          <td dir="auto">${esc(it.task)}</td>
          <td class="muted">${esc(it.owner||"—")}</td>
          <td>${esc(it.deadline||"—")}</td>
          <td><span class="pill ${priorityClass(it.priority)}">${esc(it.priority||"medium")}</span></td>
          <td>${esc(it.status||"open")}</td>
        </tr>`).join("")}
        </tbody></table></div>
      </div>`;
    }

    if(hasTx){
      const isDiarized=/^\[.+?\]:/m.test(data.transcript);
      html+=`<div class="section">
        <div class="eyebrow">Transcript <button class="copy-btn" onclick="copyText(${JSON.stringify(data.transcript)})">Copy</button></div>
        <div dir="auto">${isDiarized?renderDiarized(data.transcript):`<div class="transcript">${esc(data.transcript)}</div>`}</div>
      </div>`;
    }

    html+=`<div class="footer">Shared via <a href="/">MirzaKateb</a></div>`;
    document.getElementById("app").innerHTML=html;
  }

  window.setOut=function(id){activeOut=id;render();};
  window.copyText=function(text){
    navigator.clipboard.writeText(text).then(()=>{
      const b=event.target;b.textContent="Copied!";setTimeout(()=>b.textContent="Copy",1500);
    });
  };

  render();
}

load();
</script>
</body>
</html>
